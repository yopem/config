# Generated from the react-native Oxlint config. Run bun run sync:bun to update.
[lint]
plugins = [
  "eslint-plugin-oxfmt",
  { "name" = "quality", "specifier" = "@yopem/eslint-plugin/quality" },
  { "name" = "stylistic", "specifier" = "@yopem/eslint-plugin/stylistic" },
  { "name" = "react-doctor", "specifier" = "@yopem/eslint-plugin/react-doctor" },
]
typeAware = true
typeCheck = true
ignorePatterns = [
  "**/node_modules",
  "**/.pnp",
  "**/.pnp.js",
  "**/.env",
  "**/.env.local",
  "**/.env.development.local",
  "**/.env.test.local",
  "**/.env.production.local",
  "**/coverage",
  "**/.turbo",
  "**/.vercel",
  "**/.next/",
  "**/out/",
  "**/build",
  "**/dist",
  "**/npm-debug.log*",
  "**/yarn-debug.log*",
  "**/yarn-error.log*",
  "**/.DS_Store",
  "**/*.pem",
  "**/tsconfig.tsbuildinfo",
  "**/*.tsbuildinfo",
  "**/next-env.d.ts",
  "**/.opencode/",
  "**/openspec/",
  "**/opencode.jsonc",
  "**/AGENTS.md",
  "**/skills",
  "**/.gemini",
  "**/migrations/",
  "**/*.config.*",
]

[lint.categories]
"correctness" = "error"

[lint.rules]
"bun:test/*" = "off"
"react/*" = "off"
"react/jsx-uses-react" = "off"
"typescript/no-meaningless-void-operator" = "error"
"typescript/no-unnecessary-parameter-property-assignment" = "error"
